name: savour
description: A private, beautiful food photography journal.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cryptography: ^2.9.0
  flutter_secure_storage: ^10.3.4
  image: ^4.5.4
  image_picker: ^1.2.2
  intl: ^0.20.2
  local_auth: ^3.0.1
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/branding/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/savour_icon.png
  remove_alpha_ios: true
