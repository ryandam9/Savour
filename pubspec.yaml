name: savour
description: A private, beautiful food photography journal.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cryptography: ^2.9.0
  flutter_secure_storage: ^11.2.0
  image: ^4.5.4
  image_picker: ^1.2.2
  intl: ^0.20.2
  local_auth: ^3.0.1
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
    - assets/fonts/LICENSE-DMSans.txt
    - assets/fonts/LICENSE-CormorantGaramond.txt
  fonts:
    - family: DM Sans
      fonts:
        - asset: assets/fonts/DMSans.ttf
    - family: Cormorant Garamond
      fonts:
        - asset: assets/fonts/CormorantGaramond.ttf

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/savour_icon.png
  # Android 8+ (API 26+): genuine separate layers, no pre-masked corners.
  adaptive_icon_background: assets/branding/savour_icon_background.png
  adaptive_icon_foreground: assets/branding/savour_icon_foreground.png
  adaptive_icon_foreground_inset: 0 # source artwork already occupies the 66dp safe zone
  # Android 13+ (API 33+): dynamic-colour themed icon foreground.
  adaptive_icon_monochrome: assets/branding/savour_icon_monochrome.png
  remove_alpha_ios: true
