name: Flutter quality and Android APK
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create native platform projects
        run: bash tool/setup_platforms.sh
      - name: Validate iOS and Android launcher icons
        run: python3 tool/verify_launcher_icons.py
      - name: Dart format
        run: dart format lib test
      - name: Flutter analyse
        run: flutter analyze
      - name: Unit tests
        run: flutter test
      - name: Build Android debug APK
        run: flutter build apk --debug
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: savour-android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
